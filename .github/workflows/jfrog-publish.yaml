name: Build and Push to JFrog

on:
  push:
    branches:
      - 'main'
      - 'release-v*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch: # Allow manual trigger

env:
  JFROG_REGISTRY: ${{ secrets.JFROG_REGISTRY }}
  JFROG_REPO: ${{ secrets.JFROG_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Login to JFrog
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ secrets.JFROG_REGISTRY }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          VERSION=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.ref }}" ]]; then
            VERSION="$(git rev-parse --short HEAD)"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          
          # Validate version is set
          if [[ -z "${VERSION}" ]]; then
            echo "Error: Could not determine version"
            exit 1
          fi
          
          # Get Unix timestamp from git for reproducible builds
          DATE_EPOCH="$(git log -1 --format='%ct')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date_epoch=${DATE_EPOCH}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build and push image with ko
        env:
          KO_DOCKER_REPO: ${{ secrets.JFROG_REGISTRY }}/${{ secrets.JFROG_REPO }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.date_epoch }}
          KO_DATA_DATE_EPOCH: ${{ steps.version.outputs.date_epoch }}
          GOFLAGS: '-ldflags=-X=sigs.k8s.io/karpenter/pkg/operator.Version=${{ steps.version.outputs.version }}'
        run: |
          ko publish -B --platform=linux/amd64,linux/arm64 -t "${VERSION}" ./cmd/controller

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ secrets.JFROG_REGISTRY }}/${{ secrets.JFROG_REPO }}/controller:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
